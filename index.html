<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tangled Up</title>
  <meta name="description" content="Tangled Up — can you name the Bob Dylan song in 3 seconds?" />
  <meta property="og:title" content="Tangled Up" />
  <meta property="og:description" content="Can you name the Bob Dylan song in 3 seconds?" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'><rect x='1' y='1' width='62' height='38' rx='4' fill='%23222'/><rect x='6' y='6' width='52' height='20' rx='2' fill='%23ece6d6'/><circle cx='20' cy='16' r='5' fill='%23222'/><circle cx='44' cy='16' r='5' fill='%23222'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Tangled Up</h1>
      <p class="tagline">Can you name the Bob Dylan song in 3 seconds?</p>
    </header>

    <section class="stub" aria-label="Score">
      <span class="stat-label">Score</span><span class="stat-value" id="score">0</span>
    </section>

    <main class="main">
      <!-- Reel-to-reel deck -->
      <div class="player" id="player">
        <div class="face">
          <button class="deck" id="tape" type="button" aria-label="Play 3-second clip" disabled>
            <svg viewBox="0 0 400 240" aria-hidden="true">
              <defs>
                <radialGradient id="flange" cx="45%" cy="40%" r="60%">
                  <stop offset="0" stop-color="#f6f1e6" /><stop offset=".8" stop-color="#d3cab6" /><stop offset="1" stop-color="#b3a891" />
                </radialGradient>
                <mask id="holes" maskUnits="userSpaceOnUse" x="-80" y="-80" width="160" height="160">
                  <circle r="78" fill="#fff" />
                  <circle cx="0" cy="-45" r="21" fill="#000" /><circle cx="39" cy="22.5" r="21" fill="#000" /><circle cx="-39" cy="22.5" r="21" fill="#000" />
                </mask>
                <g id="reelFace">
                  <circle r="78" fill="url(#flange)" mask="url(#holes)" />
                  <circle r="77" fill="none" stroke="#9e937d" stroke-width="1.5" />
                  <circle r="14" fill="#6a5646" />
                  <path d="M0-13V-5M11.3 6.5 4.3 2.5M-11.3 6.5-4.3 2.5" stroke="#efe7d6" stroke-width="3" stroke-linecap="round" />
                  <circle r="3.5" fill="#2e241d" />
                </g>
              </defs>
              <!-- tape path -->
              <path class="tape-path" d="M163 112 L146 199 L254 199 L258 104" />
              <circle cx="146" cy="200" r="6" class="roller" /><circle cx="254" cy="200" r="6" class="roller" />
              <rect x="176" y="186" width="48" height="28" rx="5" class="head" />
              <rect x="186" y="193" width="28" height="3" rx="1.5" fill="#3a2f27" /><rect x="186" y="200" width="28" height="3" rx="1.5" fill="#3a2f27" />
              <!-- reels -->
              <g transform="translate(108 92)"><g class="reel"><circle class="pack" r="58" /><use href="#reelFace" /></g></g>
              <g transform="translate(292 92)"><g class="reel reel-r"><circle class="pack" r="36" /><use href="#reelFace" /></g></g>
            </svg>
          </button>
          <div class="label">
            <span class="label-title" id="labelTitle">?</span>
            <span class="label-sub" id="labelSub">Bob Dylan</span>
          </div>
          <div class="controls">
            <div class="vu" aria-hidden="true"><span class="vu-scale"></span><span class="vu-needle"></span><span class="vu-word">VU</span></div>
            <div class="vu" aria-hidden="true"><span class="vu-scale"></span><span class="vu-needle n2"></span><span class="vu-word">VU</span></div>
            <span class="led" aria-hidden="true"></span>
            <button type="button" class="key" id="playBtn" disabled><span class="key-icon">▶</span><span class="key-text">Play</span></button>
          </div>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite">Loading the tape…</p>

      <form class="guess" id="guessForm" autocomplete="off">
        <div class="guess-row">
          <div class="combo">
            <input id="guess" type="text" placeholder="Start typing a song title…" aria-label="Your guess"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" />
            <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">Guess</button>
        </div>
        <div class="guess-meta">
          <span class="pips" id="pips" aria-label="Guesses left"><i></i><i></i><i></i></span>
          <button type="button" class="link-btn" id="giveUp">Give up</button>
        </div>
      </form>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <section class="reveal" id="reveal" hidden>
        <p class="reveal-kicker" id="revealKicker">The song was</p>
        <h2 class="reveal-title" id="revealTitle"></h2>
        <p class="reveal-meta" id="revealMeta"></p>
        <p class="bonus" id="bonus" hidden></p>
        <div class="reveal-actions">
          <button type="button" class="ghost-btn" id="fullBtn">Play the song</button>
          <button type="button" class="primary-btn" id="nextBtn">Next song</button>
        </div>
      </section>

    </main>

    <footer class="colophon">
      <p><em>Tangled Up</em> — a 3-second Bob Dylan game.<span class="sep">·</span>Developed by <a href="https://tommynanto.com" target="_blank" rel="noopener">Tommy Nanto</a></p>
    </footer>
  </div>

  <!-- Hidden YouTube player. Kept at a real size (YouTube refuses to play in tiny players) but invisible. -->
  <div class="yt-wrap" aria-hidden="true"><div id="yt"></div></div>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
